<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">明亮现代的个人工作空间</title>
  <desc id="desc">一张带有桌面、电脑、植物和阳光窗景的个人主页视觉背景。</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8eee9"/>
      <stop offset="0.55" stop-color="#d6ddd7"/>
      <stop offset="1" stop-color="#c7d1cb"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#b7926a"/>
      <stop offset="1" stop-color="#7f5d41"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#273633"/>
      <stop offset="1" stop-color="#0d1716"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" x2="1">
      <stop offset="0" stop-color="#0a1514" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="1050" fill="url(#wall)"/>
